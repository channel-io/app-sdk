// --- order group (전환용): getOrders는 WmsOrderV2, 액션은 result 래핑 ---

message Buyer {
  string member_id = 1;
  string email = 2;
  string phone = 3;
  string name = 4;
}

message WmsDeliveryV2 {
  string id = 1;
  repeated string item_ids = 2;
