// OrderAddress represents a recipient/shipping address.
// The recipient's display name is `first_name` + `last_name` joined per locale.
// Providers that do not support name splitting should put the full name in `last_name`.
message OrderAddress {
  string first_name = 1;
  string last_name = 2;
  string phone_number = 3;
  string email = 4;
  string cell_phone_number = 5;
  string zipcode = 6;
  string address1 = 7;
  string address2 = 8;
  string shipping_message = 9;
  string country = 10;
  string city = 11;
  string province = 12;
  // ISO 3166-1 alpha-2 국가 코드. country 는 표시용 국가명이라 코드 비교에는 쓸 수 없다.
  string country_code = 13;
}

message OrderBankAccount {
  string bank_name = 1;
  string account_no = 2;
  string account_holder = 3;
}

message OrderDefectInfo {
  string description = 1;
  repeated string image_urls = 2;
}

message OrderClaimReason {
  string type = 1;
  string description = 2;
}

message OrderClaimability {
  // 네 값 모두 optional 이다. proto3 plain bool 은 false 와 미설정이 구별되지 않아
  // protojson 이 false 를 생략하고, 전부 불가한 아이템이 claimability: {} 로 나간다.
  // 명시적 presence 를 주면 false 도 그대로 실려 "판정했고 불가" 와 "판정 못 함" 이 갈린다.
  optional bool cancelable = 1;
  optional bool returnable = 2;
  optional bool exchangeable = 3;
  optional bool shipping_address_changeable = 4;
  // 불가 사유. 위 플래그가 false 일 때 "왜 불가한지"를 사용자에게 안내할 수 있게 채운다.
  // 판정하지 않았거나 사유를 제공하지 않는 커머스는 비워 둔다.
  string non_cancelable_reason = 5;
  string non_returnable_reason = 6;
  string non_exchangeable_reason = 7;
  string non_shipping_address_changeable_reason = 8;
}

