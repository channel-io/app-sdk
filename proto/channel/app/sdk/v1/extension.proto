  string state = 1;
  string currency = 2;
  // 금액 필드는 0 이 정상 값이라(전액 할인, 무료배송, 할인 없음) presence 가 필요하다.
  // presence 가 없으면 protojson 이 0 을 지워 "무료배송"과 "배송비 미제공"을 구별할 수 없다.
  optional double total_amount = 3;
  optional double items_amount = 4;
  optional double shipping_amount = 5;
  optional double discount_amount = 6;
  repeated string methods = 7;
  // false 가 정상 값이라 optional 이다(위 금액 필드와 같은 이유).
  optional bool require_refund_bank_account = 8;
  double tax_amount = 9;
  // discount_amount 는 아래 세 값의 합이다. 무엇으로 깎였는지 안내하려면 개별 값이 필요하다.
  // 금액 필드라 0 이 정상 값이고, 따라서 presence 가 필요하다.
  optional double point_amount = 10;
  optional double credit_amount = 11;
  optional double coupon_discount_amount = 12;
  // 아직 결제되지 않은 잔액(무통장 입금 대기, 부분 결제 등). state 만으로는 얼마가 남았는지
  // 알 수 없다. 0(완납)이 정상 값이라 presence 가 필요하다.
  optional double due_amount = 13;
}

message OrderFulfillment {
  string id = 1;
  string state = 2;
  repeated string item_ids = 3;
  string tracking_number = 4;
  string tracking_company = 5;
  string tracking_url = 6;
  double estimated_delivery_date = 7;
  // tracking_company 에는 몰의 택배사 코드가 들어가는 몰이 있어 사람이 읽을 수 없다.
  // 표시용 이름을 따로 싣는다.
  string tracking_company_name = 8;
  // 한 배송 안에서도 항목별로 상태가 갈리는 몰이 있다(부분 출하·부분 반품).
  // state 는 배송 단위 상태이고, 항목별 상태는 이쪽이다. item_ids 와 중복되지만
  // 상태를 붙일 자리가 없어 별도 목록으로 둔다.
  repeated OrderFulfillmentItem items = 9;
}

// 배송에 포함된 항목 하나와 그 항목의 상태.
message OrderFulfillmentItem {
  string item_id = 1;
  string state = 2;
}

// 세금 한 줄. 주문·배송수단·아이템 어디에도 붙을 수 있다.
message OrderTaxLine {
  double rate = 1;
  double rate_percentage = 2;
  string title = 3;
  double amount = 4;
}

// 몰이 주문·아이템에 붙인 자유 키-값(선물 메시지, 각인 문구 등).
message OrderAttribute {
  string key = 1;
  string value = 2;
}

// 주문에 적용된 배송수단 한 건.
message OrderShippingLine {
  string id = 1;
  string title = 2;
  string code = 3;
  string carrier_identifier = 4;
  repeated OrderTaxLine tax_lines = 5;
}

// 결제·환불 트랜잭션 한 건. payment.methods 는 게이트웨이 이름만 담아 착불·후불을
// 구분하지 못하므로, kind/status/gateway/manual_payment_gateway 를 그대로 보존한다.
message OrderTransaction {
  string id = 1;
  // 환불·취소가 어느 결제에 붙은 건지 추적할 때 쓴다.
  string parent_id = 2;
  string kind = 3;
  string status = 4;
  string gateway = 5;
  // 착불·후불(무통장·대금교환) 판정의 핵심 신호라, false 와 미설정을 구별해야 한다.
  optional bool manual_payment_gateway = 6;
  double amount = 7;
  string currency = 8;
  double created_at = 9;
}

// 몰이 붙인 확장 속성. value 는 type 에 따라 문자열·JSON 문자열 등 형태가 달라 해석하지 않는다.
message OrderMetafield {
  string namespace = 1;
  string key = 2;
  string value = 3;
  string type = 4;
}

message Order {
  string id = 1;
  string title = 2;
  double created_at = 3;
  repeated OrderItem items = 4;
  OrderPayment payment = 5;
  repeated OrderFulfillment fulfillments = 6;
  OrderAddress shipping_address = 7;
  repeated OrderClaim claims = 8;
}

message OrderAllowedValue {
  string value = 1;
  string label = 2;
}

message OrderFieldConfig {
  string type = 1;
  repeated OrderAllowedValue allowed_values = 2;
  string description = 3;
}

message OrderOperationOptions {
  repeated string required = 1;
  repeated string optional = 2;
  map<string, OrderFieldConfig> field_configs = 3;
}

message OrderAppCapabilities {
  OrderOperationOptions get_orders_options = 1;
  OrderOperationOptions cancel_order_options = 2;
  OrderOperationOptions return_order_options = 3;
  OrderOperationOptions exchange_order_options = 4;
  OrderOperationOptions change_address_options = 5;
}

message OrderGetOrdersInput {
  string identifier_type = 1;
  string identifier_value = 2;
}

message OrderGetOrdersOutput {
  repeated Order orders = 1;
}

message OrderGetAppConfigsInput {}

message OrderGetAppConfigsOutput {
  OrderAppCapabilities app_capabilities = 1;
}

message OrderClaimItem {
  string id = 1;
  int32 quantity = 2;
  string fulfillment_id = 3;
}

message OrderCancelOrderInput {
  string order_id = 1;
  repeated OrderClaimItem cancel_items = 2;
  OrderClaimReason reason = 3;
  OrderBankAccount refund_bank_account = 4;
}

message OrderReturnOrderInput {
  string order_id = 1;
  repeated OrderClaimItem return_items = 2;
  OrderClaimReason reason = 3;
  bool request_pickup = 4;
  OrderAddress pickup_address = 5;
  OrderBankAccount refund_bank_account = 6;
  string tracking_number = 7;
  string tracking_company = 8;
  OrderDefectInfo defect_info = 9;
  string shipping_fee_payment_type = 10;
}

message OrderExchangeItem {
  string product_id = 1;
  string variant_id = 2;
  int32 quantity = 3;
}

message OrderExchangeOrderInput {
  string order_id = 1;
  repeated OrderClaimItem before_exchange_items = 2;
  repeated OrderExchangeItem after_exchange_items = 3;
  OrderClaimReason reason = 4;
  bool request_pickup = 5;
  OrderAddress pickup_address = 6;
  OrderBankAccount refund_bank_account = 7;
  OrderDefectInfo defect_info = 8;
  string shipping_fee_payment_type = 9;
}

message OrderGetExchangeableItemsInput {
  string order_id = 1;
  repeated OrderClaimItem items = 2;
}

message OrderGetExchangeableItemsOutput {
  repeated OrderItem items = 1;
}

message OrderChangeShippingAddressInput {
  string order_id = 1;
  OrderAddress new_address = 2;
}

message OrderSuccessOutput {
  bool success = 1;
}

// ===== commerce extension (order 재설계): identifier+searchFilter, buyer, orderedAt, result 래핑 =====
// 변경 없는 값 타입(Address/BankAccount/Payment/Fulfillment/Claim 등)은 Order* 재사용.

message CommerceIdentifier {
  string type = 1;
  string value = 2;
}

message CommerceOrderItem {
  string id = 1;
  string name = 2;
  string image_url = 3;
  // 0 원 상품(사은품)이 정상이라 presence 가 필요하다.
  optional double amount = 4;
  double quantity = 5;
  string option = 6;
  string product_id = 7;
  string variant_id = 8;
  string state = 9;
  double shipped_at = 10;
  double delivered_at = 11;
  double estimated_ship_date = 12;
  OrderClaimability claimability = 13;
  string sku = 14;
  // 아직 출하되지 않은 수량. 0(전량 출하됨)과 미제공을 구별해야 해서 optional 이다.
  optional double unfulfilled_quantity = 15;
  optional bool requires_shipping = 16;
  // 정기구독 주문일 때만 채워진다.
  string selling_plan_name = 17;
  string selling_plan_id = 18;
  repeated OrderAttribute custom_attributes = 19;
  repeated OrderTaxLine tax_lines = 20;
  // state 는 몰마다 다른 상태를 공통 값으로 정규화한 것이라, 몰 고유 상태로 분기해야 하는
  // 태스크는 원문이 필요하다. status_code 는 진행 상태(접수·배송준비·배송중 등) 코드,
  // status_text 는 그 표시 문구다.
  string status_code = 21;
  string status_text = 22;
  // 클레임 성격(정상·취소·반품·교환) 코드. 진행 상태와 축이 달라 따로 싣는다.
  string claim_status_code = 23;
  // 상품 공급사. 위탁·입점 구조인 몰에서 CS 안내에 쓰인다.
  string supplier_id = 24;
  string supplier_name = 25;
  // 옵션 추가금. amount 에 이미 합산돼 있으나 분리해 보여줘야 하는 몰이 있다.
  // 0(추가금 없음)이 정상 값이라 presence 가 필요하다.
  optional double option_amount = 26;
  // 세트(번들) 상품 정보. 번들이 아니면 비어 있다. false 와 미제공이 다른 뜻이라 optional 이다.
  optional bool bundle = 27;
  string bundle_id = 28;
  string bundle_name = 29;
  // 번들 구성 방식(고정 구성·선택 구성 등) 원문 코드.
  string bundle_type = 30;
  repeated CommerceOrderBundleItem bundle_items = 31;
  // 몰이 주문 안에서 이 상품 줄에 부여한 번호. id 와 달리 사람이 읽는 순번이라 안내 문구에 쓰인다.
  string item_no = 32;
  // 옵션 구성 방식(조합형·독립형·연동형 등) 원문 코드. 방식에 따라 교환·옵션변경 가능 여부가 갈린다.
  string option_type = 33;
  // 배송 정보를 항목 단위로도 싣는다. fulfillments 는 배송 건 단위라 "이 상품의 송장번호" 를
  // 알려면 item_ids 로 되짚어야 하는데, 몰에 따라 항목이 배송 건보다 잘게 갈린다.
  string tracking_number = 34;
  // 택배사 코드와 표시명. 코드만으로는 사람이 읽을 수 없다(fulfillment 쪽과 같은 이유).
  string tracking_company = 35;
  string tracking_company_name = 36;
  // 이 항목이 속한 배송 건 코드. fulfillments[].id 와 대응한다.
  string shipping_code = 37;
  // 몰이 상품에 부여한 코드. product_id(내부 식별자)·sku(품목 단위 재고 코드)와 다른 축이다.
  // 카페24는 숫자 product_no 와 사람이 읽는 product_code("P000000Y")를 따로 두고, CS 안내와
  // 어드민 검색에는 후자를 쓴다. sku 에 넣으면 품목 단위 값이라는 뜻이 어긋난다.
  string product_code = 38;
}

// 세트(번들) 상품의 구성품 한 줄. CommerceOrderItem 의 부분집합이라 이름·수량·금액 규약이 같다.
message CommerceOrderBundleItem {
  string product_id = 1;
  string variant_id = 2;
  string name = 3;
  string sku = 4;
  string option = 5;
  double quantity = 6;
  // 0 원 구성품(사은품)이 정상이라 presence 가 필요하다.
  optional double amount = 7;
  optional double option_amount = 8;
  string supplier_id = 9;
  // 상위 항목의 product_code 와 같은 뜻(품목 단위 sku 와 다른 축).
  string product_code = 10;
}

message CommerceOrder {
  string id = 1;
  string title = 2;
  double ordered_at = 3;
  Buyer buyer = 4;
  repeated CommerceOrderItem items = 5;
  OrderPayment payment = 6;
  repeated OrderFulfillment fulfillments = 7;
  OrderAddress shipping_address = 8;
  repeated OrderClaim claims = 9;
  // 매니저가 몰 어드민의 해당 주문으로 바로 이동할 수 있는 링크.
  string admin_url = 10;
  string note = 11;
  // payment.state 하나로는 부분환불·부분출하가 구분되지 않아 몰의 원문 상태를 함께 싣는다.
  string display_financial_status = 12;
  string display_fulfillment_status = 13;
  // 아래 bool 들은 false 와 미제공이 다른 의미라 optional 이다.
  optional bool test = 14;
  optional bool first_order = 15;
  optional bool closed = 16;
  optional bool confirmed = 17;
  optional bool taxes_included = 18;
  optional double total_weight = 19;
  // 주문이 생성된 경로(예: Online Store).
  string app_name = 20;
  OrderAddress billing_address = 21;
  repeated OrderAttribute custom_attributes = 22;
  repeated OrderShippingLine shipping_lines = 23;
  repeated OrderTransaction transactions = 24;
  repeated OrderMetafield metafields = 25;
  // 외부 마켓(네이버·쿠팡 등)에서 유입된 주문이 어느 마켓 것인지. 자사몰 주문이면 빈 값이다.
  string market_id = 26;
  // 그 마켓이 발번한 주문번호. 몰 주문번호(id)와 달라 CS 조회 키로 쓰인다.
  string market_order_no = 27;
}

message CommerceGetOrdersInput {
  CommerceIdentifier identifier = 1;
  google.protobuf.Value search_filter = 2;
  string since = 3;
  int32 limit = 4;
}

message CommerceGetOrdersOutput {
  repeated CommerceOrder orders = 1;
  string next = 2;
}

message CommerceAppCapabilities {
  OrderOperationOptions get_orders_options = 1;
  OrderOperationOptions request_cancel_order_options = 2;
  OrderOperationOptions request_return_order_options = 3;
  OrderOperationOptions accept_return_order_options = 4;
  OrderOperationOptions request_exchange_order_options = 5;
  OrderOperationOptions change_shipping_address_options = 6;
}

message CommerceGetAppConfigsInput {}

message CommerceGetAppConfigsOutput {
  CommerceAppCapabilities app_capabilities = 1;
}

message CommerceResultBody {
  // 성공 여부. 실패(false)도 정상 응답이라 반드시 값이 실려야 해서 optional 이다 —
  // presence 가 없으면 protojson 이 false 를 지워 실패 응답에서 키가 사라진다.
  optional bool success = 1;
  string error_message = 2;
}

message CommerceActionResult {
  CommerceResultBody result = 1;
}

message CommerceCancelOrderInput {
  CommerceIdentifier identifier = 1;
  string order_id = 2;
  repeated OrderClaimItem cancel_items = 3;
  OrderClaimReason reason = 4;
  OrderBankAccount refund_bank_account = 5;
}

message CommerceReturnOrderInput {
  CommerceIdentifier identifier = 1;
  string order_id = 2;
  repeated OrderClaimItem return_items = 3;
  OrderClaimReason reason = 4;
  bool request_pickup = 5;
  OrderAddress pickup_address = 6;
  OrderBankAccount refund_bank_account = 7;
  string tracking_number = 8;
  string tracking_company = 9;
  OrderDefectInfo defect_info = 10;
}

message CommerceAcceptReturnOrderInput {
  CommerceIdentifier identifier = 1;
  string order_id = 2;
  repeated OrderClaimItem return_items = 3;
  OrderClaimReason reason = 4;
  OrderBankAccount refund_bank_account = 5;
  bool pickup_completed = 6;
  bool request_pickup = 7;
}

message CommerceExchangeOrderInput {
  CommerceIdentifier identifier = 1;
  string order_id = 2;
  repeated OrderClaimItem before_exchange_items = 3;
  repeated OrderExchangeItem after_exchange_items = 4;
  OrderClaimReason reason = 5;
  bool request_pickup = 6;
  OrderAddress pickup_address = 7;
  OrderBankAccount refund_bank_account = 8;
  OrderDefectInfo defect_info = 9;
}

message CommerceGetExchangeableItemsInput {
  CommerceIdentifier identifier = 1;
  string order_id = 2;
  repeated OrderClaimItem items = 3;
}

message CommerceGetExchangeableItemsOutput {
  // 아이템별 교환 후보. 어떤 주문 아이템을 어떤 variant 로 바꿀 수 있고 추가금이 얼마인지 준다 —
  // requestExchangeOrder 의 after_exchange_items(variant_id) 를 채우려면 이 목록이 필요하다.
  repeated CommerceExchangeableItem exchangeable_items = 1;
}

message CommerceExchangeableItem {
  // 교환 후보의 대상이 되는 주문 아이템 id — getOrders 의 items[].id, 이 함수 입력의
  // items[].id 와 같은 값이다. 응답에 여러 아이템이 섞여 오므로 호출자는 이 키로 입력과
  // 짝을 맞추고, requestExchangeOrder 의 before_exchange_items[].id 로 그대로 넘긴다.
  string id = 1;
  // 주문 아이템의 상품 id (CommerceOrderItem.product_id 와 같다).
  string product_id = 2;
  repeated CommerceExchangeableVariant variants = 3;
}

message CommerceExchangeableVariant {
  // 교환 대상 variant id. requestExchangeOrder 의 after_exchange_items.variant_id 로 그대로 쓴다.
  string id = 1;
  // 원래 아이템 대비 추가 결제 금액. 추가금 없는 variant 가 대부분이라 0 이 정상 값이고,
  // presence 가 없으면 그 경우 키가 사라진다.
  optional double additional_amount = 2;
  repeated CommerceVariantOption options = 3;
  // 재고 수량. 재고 관리를 쓰지 않는 variant 는 수량 개념이 없어 비워 둔다 — 0(품절)과
  // 미제공(무제한)을 구별해야 해서 optional 이다.
  optional double stock_quantity = 4;
  // 재고 관리 사용 여부. false 면 stock_quantity 는 의미가 없다.
  optional bool use_inventory = 5;
  optional bool selling = 6;
  optional bool display = 7;
}

message CommerceVariantOption {
  // 옵션명(예: 색상).
  string name = 1;
  // 옵션값(예: 블랙).
  string value = 2;
}

message CommerceChangeShippingAddressInput {
  CommerceIdentifier identifier = 1;
  string order_id = 2;
  OrderAddress new_address = 3;
}

